<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas</title>

    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/Consultas-style.css">
    <link rel="stylesheet" href="assets/css/nav-sidebar.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="assets/js/auth.js" data-role="Administrador"></script>
</head>

<body>
        <nav class="main-top-nav">
            <div class="logo-wrap">
                <img
                    src="assets/img/logo.png"
                    alt="Pórtico Construcciones y Servicios"
                />
            </div>
            <div class="user-pill">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="user-pill-name">Admin</span>
            </div>
        </nav>

        <!-- Barra de Navegación Horizontal (Sub-header) -->
       <nav class="dashboard-nav-tabs" aria-label="Navegación principal">
    <div class="nav-tabs-container">

        <a href="PanelInicio.html" class="nav-tab-item">
            <i class="fa-solid fa-house"></i>
            <span>Panel</span>
        </a>

        <a href="Obras.html" class="nav-tab-item">
            <i class="fa-solid fa-helmet-safety"></i>
            <span>Obras</span>
        </a>

        <a href="RegistrarObrero.html" class="nav-tab-item">
            <i class="fa-solid fa-users"></i>
            <span>Obreros</span>
        </a>

        <a href="Maquinaria.html" class="nav-tab-item">
            <i class="fa-solid fa-truck"></i>
            <span>Maquinaria</span>
        </a>

        <a href="Asistencia.html" class="nav-tab-item">
            <i class="fa-solid fa-clipboard-check"></i>
            <span>Asistencias</span>
        </a>

        <a href="Facturas.html" class="nav-tab-item">
            <i class="fa-solid fa-file-invoice-dollar"></i>
            <span>Facturas</span>
        </a>

        <!-- PANTALLA ACTUAL -->
        <a href="Consultas.html" class="nav-tab-item active">
            <i class="fa-solid fa-chart-column"></i>
            <span>Consultas</span>
        </a>

        <a href="LogsAuditoria.html" class="nav-tab-item">
            <i class="fa-solid fa-file-lines"></i>
            <span>Logs</span>
        </a>

        <a href="ExportarDatos.html" class="nav-tab-item">
            <i class="fa-solid fa-download"></i>
            <span>Exportar</span>
        </a>

        <a href="TablaUsuarios.html" class="nav-tab-item">
            <i class="fa-solid fa-user"></i>
            <span>Usuarios</span>
        </a>

        <a href="Login.html" class="nav-tab-item nav-tab-logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Salir</span>
        </a>

    </div>
</nav>

    <!-- CONTENIDO -->
    <main>

        <div class="card">

            <!-- FEEDBACK -->
            <div id="feedback"
                 class="feedback-msg hidden"
                 role="alert"
                 aria-live="polite">
            </div>

            <!-- FILTROS -->
            <div class="form-section">

                <h1>Consultas de Obreros</h1>

                <label for="obreroSearchInput">Seleccionar Obrero</label>
                <div class="obrero-combobox-wrap">
                    <input type="hidden" id="obrero" name="id_obrero" value="" />
                    <div class="obrero-search-box">
                        <input
                            type="text"
                            id="obreroSearchInput"
                            class="obrero-search-input"
                            placeholder="Escribí nombre, apellido, DNI o cargo..."
                            autocomplete="off"
                        />
                        <button type="button" id="obreroClearBtn" class="obrero-clear-btn" title="Limpiar selección">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div id="obreroDropdown" class="obrero-dropdown-list hidden"></div>
                    <div id="obreroSelectedCard" class="obrero-selected-card hidden">
                        <span id="obreroSelectedText" class="obrero-selected-text"></span>
                        <span style="font-size:11px;color:#888;">(Seleccionado)</span>
                    </div>
                </div>

                <label>Período de búsqueda</label>

                <div class="date-range">

                    <div class="date-group">
                        <span>Desde</span>

                        <input
                            type="date"
                            id="fecha_desde">
                    </div>

                    <div class="date-group">
                        <span>Hasta</span>

                        <input
                            type="date"
                            id="fecha_hasta">
                    </div>

                </div>

                <button
                    id="btnBuscar"
                    class="btn-search">
                    Buscar
                </button>

                <a href="PanelInicio.html"
                   class="btn-back">
                    Volver
                </a>

            </div>

            <!-- RESULTADOS -->
            <div class="result-section">

                <!-- RESUMEN -->
                <div id="resumen-consultas"
                     class="resumen-consultas">
                </div>

                <!-- TABLA -->
                <div class="table">

                    <table>

                        <thead>

                            <tr>
                                <th>Fecha</th>
                                <th>Obra</th>
                                <th>Entrada</th>
                                <th>Salida</th>
                                <th>Horas</th>
                            </tr>

                        </thead>

                        <tbody id="tabla-registros">

                            <tr>
                                <td colspan="5"
                                    class="no-data">
                                    Seleccione un obrero y un período para realizar la búsqueda.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="pagination hidden" id="pagination">
                    <span class="pagination-info" id="paginationInfo">Mostrando 0-0 de 0 registros</span>
                    <div class="pagination-actions">
                        <button type="button" class="pagination-btn" id="paginationPrev">Anterior</button>
                        <span class="pagination-page" id="paginationPage">Página 1 de 1</span>
                        <button type="button" class="pagination-btn" id="paginationNext">Siguiente</button>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script src="assets/js/consultas.js"></script>

</body>
</html>
