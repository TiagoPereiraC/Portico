        <!-- Barra de Navegación Horizontal (Sub-header) -->

            <div class="nav-tabs-container">
                <a href="PanelInicio.html" class="nav-tab-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

                <a href="Obras.html" class="nav-tab-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1 8 8 0 0 0-16 0"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15h16"/></svg>
                    <span>Obras</span>
                </a>
                <a href="RegistrarObrero.html" class="nav-tab-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>Obreros</span>
                </a>
                <a href="Maquinaria.html" class="nav-tab-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>

                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span>Asistencias</span>
                </a>
                <a href="Consultas.html" class="nav-tab-item active">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <span>Consultas</span>

            </div>
        </nav>

    <!-- CONTENIDO -->
    <main>

        <div class="card">

            <!-- FEEDBACK -->
            <div id="feedback"
                 class="feedback-msg hidden"
                 role="alert"
                 aria-live="polite">
            </div>

            <!-- FILTROS -->
            <div class="form-section">

                <h1>Consultas de Obreros</h1>

                <label for="obreroSearchInput">Seleccionar Obrero</label>
                <div class="obrero-combobox-wrap">
                    <input type="hidden" id="obrero" name="id_obrero" value="" />
                    <div class="obrero-search-box">
                        <input
                            type="text"
                            id="obreroSearchInput"
                            class="obrero-search-input"
                            placeholder="Escribí nombre, apellido, DNI o cargo..."
                            autocomplete="off"
                        />
                        <button type="button" id="obreroClearBtn" class="obrero-clear-btn" title="Limpiar selección">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div id="obreroDropdown" class="obrero-dropdown-list hidden"></div>
                    <div id="obreroSelectedCard" class="obrero-selected-card hidden">
                        <span id="obreroSelectedText" class="obrero-selected-text"></span>
                        <span style="font-size:11px;color:#888;">(Seleccionado)</span>
                    </div>
                </div>

                <label>Período de búsqueda</label>

                <div class="date-range">

                    <div class="date-group">
                        <span>Desde</span>

                        <input
                            type="date"
                            id="fecha_desde">
                    </div>

                    <div class="date-group">
                        <span>Hasta</span>

                        <input
                            type="date"
                            id="fecha_hasta">
                    </div>

                </div>

                <button
                    id="btnBuscar"
                    class="btn-search">
                    Buscar
                </button>

                <a href="PanelInicio.html"
                   class="btn-back">
                    Volver
                </a>

            </div>

            <!-- RESULTADOS -->
            <div class="result-section">

                <!-- RESUMEN -->
                <div id="resumen-consultas"
                     class="resumen-consultas">
                </div>

                <!-- TABLA -->
                <div class="table">

                    <table>

                        <thead>

                            <tr>
                                <th>Fecha</th>
                                <th>Obra</th>
                                <th>Entrada</th>
                                <th>Salida</th>
                                <th>Horas</th>
                            </tr>

                        </thead>

                        <tbody id="tabla-registros">

                            <tr>
                                <td colspan="5"
                                    class="no-data">
                                    Seleccione un obrero y un período para realizar la búsqueda.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="pagination hidden" id="pagination">
                    <span class="pagination-info" id="paginationInfo">Mostrando 0-0 de 0 registros</span>
                    <div class="pagination-actions">
                        <button type="button" class="pagination-btn" id="paginationPrev">Anterior</button>
                        <span class="pagination-page" id="paginationPage">Página 1 de 1</span>
                        <button type="button" class="pagination-btn" id="paginationNext">Siguiente</button>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script src="assets/js/consultas.js"></script>

</body>
</html>
