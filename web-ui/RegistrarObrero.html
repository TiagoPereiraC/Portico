<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/RegObrero.css">
<link rel="stylesheet" href="assets/css/nav-sidebar.css">
</head>

<body>

<div class="nav-dropdown">
  <button class="nav-menu-btn"><i class="fas fa-bars"></i> Menú</button>
  <ul class="nav-dropdown-menu">
    <li><a href="PanelInicio.html"><i class="fas fa-home"></i> Panel</a></li>
    <li><a href="RegistrarObra.html"><i class="fas fa-building"></i> Obras</a></li>
    <li><a href="RegistrarObrero.html" class="active"><i class="fas fa-helmet-safety"></i> Obreros</a></li>
    <li><a href="Asistencia.html"><i class="fas fa-clipboard-list"></i> Asistencia</a></li>
    <li><a href="Consultas.html"><i class="fas fa-chart-column"></i> Consultas</a></li>
    <li><a href="Login.html"><i class="fas fa-right-from-bracket"></i> Salir</a></li>
  </ul>
</div>

<nav>
  <div class="logo-wrap">
    <img src="assets/img/logo.png" alt="Pórtico Construcciones y Servicios">
  </div>
  <div class="user-pill">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
    </svg>
    Admin
  </div>
</nav>

<main>
  <div class="card">
   <h2>Registrar Obrero</h2>

    <div class="grupo">
      <div class="label">Nombre completo</div>
      <input type="text" id="nombre" name="nombre" class="input" placeholder="Ej: Juan Carlos Mendoza">
    </div>

    <div class="grupo">
      <div class="label">DNI / Cédula</div>
      <input type="text" id="documento" name="documento" class="input" placeholder="Ej: 5.123.456-7">
    </div>

    <div class="grupo">
      <div class="label">Teléfono</div>
      <input type="text" id="telefono" name="telefono" class="input" placeholder="Ej: 099 123 456 o +598 99 123 456">
    </div>

    <div class="fecha">
      <label>Fecha Contratación</label>
      <input type="date" id="fecha_contratacion" name="fecha_contratacion" value="2026-04-30">
    </div>

    <button class="btn">Guardar</button>
    <a href="PanelInicio.html" class="btn-back">Volver</a>
  </div>
</main>

</body>
</html>
