<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Obrero</title>

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* BODY */
body{
  background-color:#8f3d3d;
  min-height:100vh;
}

/* HEADER */
.header{
  width:100%;
  height:200px;
  background:white;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:20px 50px;
}

/* LOGO */
.logo img{
  height:170px;
}

/* ADMIN */
.admin{
  font-size:15px;
  color:black;
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:5px;
}

.admin i{
  font-size:18px;
}

/* CONTENEDOR */
.contenedor{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100vh - 200px);
  flex-direction:column;
}

/* CARD */
.card{
  background:#e7dfdf;
  padding:50px 45px;
  border-radius:25px;
  width:480px;
  text-align:left;
}

/* TITULO */
.card h2{
  text-align:center;
  color:#6b6b6b;
  margin-bottom:30px;
  font-size:26px;
}

/* GRUPO */
.grupo{
  margin-bottom:18px;
}

/* LABEL */
.label{
  font-size:13px;
  font-weight:bold;
  color:#444;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:8px;
}

.label i{
  color:#c0392b;
}

/* INPUT */
.input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:18px;
  background:#dcdcdc;
  box-shadow: inset 0 3px 5px rgba(0,0,0,0.25);
  font-size:15px;
}

/* FECHA */
.fecha{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 0 25px;
  font-size:14px;
  color:#444;
}

.fecha label{
  display:flex;
  align-items:center;
  gap:8px;
}

.fecha input{
  padding:10px;
  border:none;
  border-radius:12px;
  background:#dcdcdc;
  box-shadow: inset 0 2px 3px rgba(0,0,0,0.2);
}

/* BOTON */
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:20px;
  background:#c0392b;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.btn:hover{
  background:#a93226;
}

/* FOOTER */
.footer{
  margin-top:15px;
  font-size:12px;
  color:#eee;
  text-align:center;
}

.footer i{
  margin:0 5px;
}

.card h2 i{
  margin-right:10px;
  color:#c0392b;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="logo.png" alt="Pórtico">
  </div>

  <div class="admin">
    <i class="fas fa-user"></i> Admin
  </div>
</div>

<div class="contenedor">
  <div class="card">
   <h2><i class="fas fa-user-plus"></i> Registrar Obrero</h2>

    <div class="grupo">
      <div class="label"><i class="fas fa-user-circle"></i> Nombre completo</div>
      <input type="text" class="input" placeholder="Ej: Juan Carlos Mendoza">
    </div>

    <div class="grupo">
      <div class="label"><i class="fas fa-id-card"></i> DNI / Cédula</div>
   <input type="text" class="input" placeholder="Ej: 5.123.456-7">
    </div>

    <div class="grupo">
      <div class="label"><i class="fas fa-mobile-alt"></i> Teléfono</div>
      <input type="text" class="input" placeholder="Ej: 099 123 456 o +598 99 123 456">
    </div>

    <div class="fecha">
      <label><i class="fas fa-calendar-alt"></i> Fecha Contratación</label>
      <input type="date" value="2026-05-20">
    </div>

    <button class="btn">
      <i class="fas fa-save"></i> Guardar
    </button>
  </div>

  <div class="footer">
    <i class="fas fa-helmet-safety"></i>
    Pórtico Construcciones y Servicios · Gestión de personal
    <i class="fas fa-tools"></i>
  </div>
</div>

</body>
</html>
