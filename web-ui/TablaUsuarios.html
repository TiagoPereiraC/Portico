        <main>
            <div class="card">
                <h2>Usuarios Registrados</h2>

                <div id="feedback" class="feedback" hidden></div>

                <div class="toolbar">
                    <a href="CrearCuenta.html" class="btn-new">
                        <i class="fas fa-user-plus"></i> Nueva Cuenta
                    </a>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="users-body">
                            <tr>
                                <td colspan="4" class="table-status">
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination hidden" id="pagination">
                    <span class="pagination-info" id="paginationInfo">Mostrando 0-0 de 0 usuarios</span>
                    <div class="pagination-actions">
                        <button type="button" class="pagination-btn" id="paginationPrev">Anterior</button>
                        <span class="pagination-page" id="paginationPage">Página 1 de 1</span>
                        <button type="button" class="pagination-btn" id="paginationNext">Siguiente</button>
                    </div>
                </div>

                <a href="PanelInicio.html" class="btn-back">Volver</a>
            </div>
        </main>

        <div id="modalConfirm" class="modal-confirm" aria-hidden="true">
            <div class="modal-content">
                <div class="modal-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h3>¿Eliminar usuario?</h3>
                <p id="modalUsuarioTexto">Esta acción no se puede deshacer.</p>
                <div class="modal-buttons">
                    <button
                        class="modal-btn modal-cancel"
                        id="btnCancelar"
                        type="button"
                    >
                        Cancelar
                    </button>
                    <button
                        class="modal-btn modal-delete"
                        id="btnConfirmarEliminar"
                        type="button"
                    >
                        Eliminar
                    </button>
                </div>
            </div>
        </div>

        <script>
            const tbody = document.getElementById("users-body");
            const feedbackEl = document.getElementById("feedback");
            const modal = document.getElementById("modalConfirm");
            const modalTexto = document.getElementById("modalUsuarioTexto");
            const btnCancelar = document.getElementById("btnCancelar");
            const btnConfirmar = document.getElementById(
                "btnConfirmarEliminar",
            );

            const pagination = document.getElementById("pagination");
            const paginationInfo = document.getElementById("paginationInfo");
            const paginationPage = document.getElementById("paginationPage");
            const paginationPrev = document.getElementById("paginationPrev");
            const paginationNext = document.getElementById("paginationNext");

            const USUARIOS_POR_PAGINA = 10;
            let paginaActual = 1;
            let totalPaginas = 1;
            let totalUsuarios = 0;

            let pendingDelete = null;

            btnCancelar.addEventListener("click", closeModal);
            btnConfirmar.addEventListener("click", confirmDelete);
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    closeModal();
                }
            });
            paginationPrev.addEventListener("click", function () {
                cambiarPagina(-1);
            });
            paginationNext.addEventListener("click", function () {
                cambiarPagina(1);
            });

            tbody.addEventListener("click", function (event) {
                const deleteButton = event.target.closest(".btn-delete");
                if (!deleteButton) {
                    return;
                }

                pendingDelete = {
                    id: Number(deleteButton.dataset.id),
                    usuario: deleteButton.dataset.usuario || "",
                };

                modalTexto.innerHTML = `Estás a punto de eliminar a <strong>${escapeHtml(pendingDelete.usuario)}</strong>. Esta acción no se puede deshacer.`;
                modal.classList.add("active");
                modal.setAttribute("aria-hidden", "false");
                document.body.classList.add("modal-open");
            });

            loadUsers();
            showFlashMessage();

            async function loadUsers() {
                tbody.innerHTML =
                    '<tr><td colspan="4" class="table-status">Cargando usuarios...</td></tr>';

                try {
                    const data = await window.userApi.listUsers({
                        page: paginaActual,
                        limit: USUARIOS_POR_PAGINA,
                    });
                    renderUsers(data.users || []);
                    totalUsuarios = Number(data.total || 0);
                    totalPaginas = Math.max(1, Number(data.total_pages || 1));
                    paginaActual = Math.min(
                        Math.max(1, Number(data.page || paginaActual)),
                        totalPaginas,
                    );
                    actualizarPaginacion();
                } catch (error) {
                    tbody.innerHTML = `<tr><td colspan="4" class="table-status">${escapeHtml(error.message || "No se pudieron cargar los usuarios.")}</td></tr>`;
                    showFeedback(
                        error.message || "No se pudieron cargar los usuarios.",
                        "error",
                    );
                }
            }

            function renderUsers(users) {
                if (!Array.isArray(users) || users.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="4" class="table-status">No hay usuarios registrados.</td></tr>';
                    return;
                }

                tbody.innerHTML = users
                    .map(function (user) {
                        return `
      <tr>
        <td>${escapeHtml(user.nombre)}</td>
        <td>${escapeHtml(user.usuario)}</td>
        <td>${escapeHtml(user.rol)}</td>
        <td>
          <div class="table-actions">
            <a href="EditarUsuario.html?id=${encodeURIComponent(user.id_usuario)}" class="btn-edit" title="Editar usuario">
              <i class="fas fa-pen"></i>
            </a>
            <button class="btn-delete" type="button" data-id="${user.id_usuario}" data-usuario="${escapeHtml(user.usuario)}" title="Eliminar usuario">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>`;
                    })
                    .join("");
            }

            async function confirmDelete() {
                if (!pendingDelete?.id) {
                    closeModal();
                    return;
                }

                btnConfirmar.disabled = true;

                try {
                    const data = await window.userApi.deleteUser(
                        pendingDelete.id,
                    );
                    showFeedback(
                        data.message || "Usuario eliminado correctamente.",
                        "success",
                    );
                    closeModal();
                    await loadUsers();
                } catch (error) {
                    showFeedback(
                        error.message || "No se pudo eliminar el usuario.",
                        "error",
                    );
                    btnConfirmar.disabled = false;
                }
            }

            function closeModal() {
                modal.classList.remove("active");
                modal.setAttribute("aria-hidden", "true");
                document.body.classList.remove("modal-open");
                btnConfirmar.disabled = false;
                pendingDelete = null;
            }

            function showFlashMessage() {
                const raw = sessionStorage.getItem("user_flash");
                if (!raw) {
                    return;
                }

                sessionStorage.removeItem("user_flash");

                try {
                    const flash = JSON.parse(raw);
                    if (flash?.message) {
                        showFeedback(flash.message, flash.type || "success");
                    }
                } catch {
                    showFeedback(raw, "success");
                }
            }

            function showFeedback(message, type) {
                if (!message) {
                    feedbackEl.hidden = true;
                    feedbackEl.textContent = "";
                    feedbackEl.className = "feedback";
                    return;
                }

                feedbackEl.hidden = false;
                feedbackEl.textContent = message;
                feedbackEl.className = `feedback feedback-${type}`;
            }

            function actualizarPaginacion() {
                pagination.classList.toggle(
                    "hidden",
                    totalUsuarios === 0 || totalPaginas === 1,
                );

                const desde =
                    totalUsuarios === 0
                        ? 0
                        : (paginaActual - 1) * USUARIOS_POR_PAGINA + 1;
                const hasta = Math.min(
                    paginaActual * USUARIOS_POR_PAGINA,
                    totalUsuarios,
                );

                paginationInfo.textContent =
                    "Mostrando " +
                    desde +
                    "-" +
                    hasta +
                    " de " +
                    totalUsuarios +
                    " " +
                    (totalUsuarios === 1 ? "usuario" : "usuarios");
                paginationPage.textContent =
                    "Página " + paginaActual + " de " + totalPaginas;
                paginationPrev.disabled = paginaActual === 1;
                paginationNext.disabled = paginaActual === totalPaginas;
            }

            async function cambiarPagina(direccion) {
                const nuevaPagina = paginaActual + direccion;
                if (nuevaPagina < 1 || nuevaPagina > totalPaginas) {
                    return;
                }

                paginaActual = nuevaPagina;
                await loadUsers();
            }

            function escapeHtml(value) {
                return String(value ?? "").replace(/[&<>"']/g, function (char) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;",
                    }[char];
                });
            }
        </script>
