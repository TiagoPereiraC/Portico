        <main>
            <div class="card">
                <div class="header-row">
                    <div>
                        <h2>Logs de Auditoria</h2>
                        <p>Seguimiento de acciones relevantes del sistema.</p>
                    </div>
                </div>

                <div id="feedback" class="feedback" hidden></div>

                <form id="filtersForm" class="filters-grid">
                    <label>
                        <span>Usuario</span>
                        <input type="text" id="filterUsuario" placeholder="Buscar por usuario" />
                    </label>
                    <label>
                        <span>Acción</span>
                        <select id="filterAccion"><option value="">Todas</option></select>
                    </label>
                    <label>
                        <span>Entidad</span>
                        <select id="filterEntidad"><option value="">Todas</option></select>
                    </label>
                    <label>
                        <span>Desde</span>
                        <input type="date" id="filterFechaDesde" />
                    </label>
                    <label>
                        <span>Hasta</span>
                        <input type="date" id="filterFechaHasta" />
                    </label>
                    <div class="filters-actions">
                        <button type="submit" class="btn-primary">Filtrar</button>
                        <button type="button" id="btnReset" class="btn-secondary">Limpiar</button>
                    </div>
                </form>

                <div class="summary-bar"><span id="summaryText">Cargando logs...</span></div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Tipo</th>
                                <th>Módulo</th>
                                <th>ID</th>
                                <th>Origen</th>
                                <th>Resumen</th>
                            </tr>
                        </thead>
                        <tbody id="logsBody">
                            <tr><td colspan="8" class="table-status">Cargando logs...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination hidden" id="pagination">
                    <span class="pagination-info" id="paginationInfo">Mostrando 0-0 de 0 registros</span>
                    <div class="pagination-actions">
                        <button type="button" class="pagination-btn" id="paginationPrev">Anterior</button>
                        <span class="pagination-page" id="paginationPage">Página 1 de 1</span>
                        <button type="button" class="pagination-btn" id="paginationNext">Siguiente</button>
                    </div>
                </div>

                <a href="PanelInicio.html" class="btn-back">Volver</a>
            </div>
