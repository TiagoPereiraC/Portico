<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>

    <link rel="stylesheet" href="assets/css/CrearCuenta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="card">
         <img src="assets/img/logo.png" alt="Logo" class="logo">

        <h2>Crear Cuenta</h2>

        <form>

            <div class="input-group">
                <i class="fas fa-id-card"></i>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" maxlength="100" required>
            </div>

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" maxlength="50" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
                <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="input-group select-rol">
                <i class="fas fa-users"></i>
                <select id="rol" name="rol" required>
                    <option value="">Seleccionar rol</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Capataz">Capataz</option>
                </select>
            </div>

            <button class="btn" type="submit">Crear Cuenta</button>
            <a href="TablaUsuarios.html" class="btn-back">Volver</a>

        </form>
    </div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>

</body>

</html>
