<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Asistencia</title>

<link rel="stylesheet" href="assets/css/Asistencias.css">
<link rel="stylesheet" href="assets/css/nav-sidebar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="assets/js/auth.js"></script>
</head>

<body>

<div class="nav-dropdown">
  <button class="nav-menu-btn"><i class="fas fa-bars"></i> Menú</button>
  <ul class="nav-dropdown-menu">
    <li class="nav-admin"><a href="PanelInicio.html"><i class="fas fa-home"></i> Panel</a></li>
    <li class="nav-admin"><a href="RegistrarObra.html"><i class="fas fa-building"></i> Obras</a></li>
    <li class="nav-admin"><a href="RegistrarObrero.html"><i class="fas fa-helmet-safety"></i> Obreros</a></li>
    <li><a href="Asistencia.html" class="active"><i class="fas fa-clipboard-list"></i> Asistencia</a></li>
    <li class="nav-admin"><a href="Consultas.html"><i class="fas fa-chart-column"></i> Consultas</a></li>
    <li><a href="Login.html"><i class="fas fa-right-from-bracket"></i> Salir</a></li>
  </ul>
</div>

<script>
  if (sessionStorage.getItem('rol') === 'Capataz') {
    document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'none');
  }
</script>

<nav>
  <div class="logo-wrap">
    <img src="assets/img/logo.png">
  </div>
  <div class="user-pill">Admin</div>
</nav>

<main>

<form class="form" method="POST" action="../api/guardar_asistencia.php">

<h2>Registrar Asistencia</h2>

<div class="grid">

<!-- OBRA -->
<div class="full">
<label class="label">Obra</label>
<select name="id_obra" id="selectObra" required></select>
</div>

<!-- FECHA -->
<div>
<label class="label">Fecha</label>
<input type="date" name="fecha" required>
</div>

<!-- OBREROS -->
<div class="full">
<label class="label">Obreros</label>
<select id="selectObrero"></select>
</div>

<div class="full">
  <label class="label">Obreros seleccionados</label>
<div id="listaObreros"></div>
</div>

<div class="full">
<label class="label">Horarios</label>
<div id="contenedorHorarios"></div>
</div>

<!-- FINALIZA -->
<div>
<label class="label">¿Finaliza obra?</label>
<select name="finaliza">
<option value="No">No</option>
<option value="Sí">Sí</option>
</select>
</div>

<!-- MATERIALES -->
<div class="full">
<h3>Materiales</h3>

<div class="smart-box">
<select id="selectMaterial"></select>
<input type="text" id="nuevoMaterial" placeholder="Nuevo material">
</div>

<div class="smart-box">
<input type="number" id="cantidadMaterial" placeholder="Cantidad">
<input type="number" id="costoMaterial" placeholder="Costo">
</div>

<button class="btn" type="button" id="btnMaterial">Agregar</button>

<div id="listaMateriales"></div>
</div>

<!-- HERRAMIENTAS -->
<div class="full">
<h3>Herramientas</h3>

<div class="smart-box">
<select id="selectHerramienta"></select>
<input type="text" id="nuevaHerramienta" placeholder="Nueva herramienta">
</div>

<input type="number" id="cantidadHerramienta" placeholder="Cantidad">

<button class="btn" type="button" id="btnHerramienta">Agregar</button>

<div id="listaHerramientas"></div>
</div>

<!-- BOTÓN -->
<div class="full">
<button class="btn" type="submit">Guardar</button>
<a href="PanelInicio.html" class="btn-back">Volver</a>

</div>
</form>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const selectObra = document.getElementById("selectObra");
  const selectObrero = document.getElementById("selectObrero");
  const lista = document.getElementById("listaObreros");
  const horarios = document.getElementById("contenedorHorarios");

  const listaMateriales = document.getElementById("listaMateriales");
  const listaHerramientas = document.getElementById("listaHerramientas");

  let obrerosSeleccionados = [];

  // ================= FETCH =================
  fetch("../api/datos_asistencia.php")
  .then(res => res.json())
  .then(data => {

    // OBRAS
    selectObra.innerHTML = '<option value="">Seleccionar obra</option>';
    data.obras.forEach(o => {
      const opt = document.createElement("option");
      opt.value = o.id_obra;
      opt.textContent = o.nombre;
      selectObra.appendChild(opt);
    });

    // OBREROS
    selectObrero.innerHTML = '<option value="">Seleccionar obrero</option>';
    data.obreros.forEach(o => {
      const opt = document.createElement("option");
      opt.value = o.id_obrero;
      opt.textContent = o.nombre + " " + o.apellido;
      selectObrero.appendChild(opt);
    });

    // MATERIALES
    const selectMaterial = document.getElementById("selectMaterial");
    selectMaterial.innerHTML = '<option value="">Seleccionar</option>';
    data.materiales.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.nombre;
      opt.textContent = m.nombre;
      selectMaterial.appendChild(opt);
    });

    // HERRAMIENTAS
    const selectHerramienta = document.getElementById("selectHerramienta");
    selectHerramienta.innerHTML = '<option value="">Seleccionar</option>';
    data.herramientas.forEach(h => {
      const opt = document.createElement("option");
      opt.value = h.nombre;
      opt.textContent = h.nombre;
      selectHerramienta.appendChild(opt);
    });

  });

  // ================= OBREROS =================
  selectObrero.addEventListener("change", () => {

    const id = selectObrero.value;
    const nombre = selectObrero.options[selectObrero.selectedIndex].text;

    if (!id || obrerosSeleccionados.includes(id)) return;

    obrerosSeleccionados.push(id);

    const item = document.createElement("div");
    item.classList.add("obrero-item");
    item.id = "obrero-" + id;

    item.innerHTML = `
      <span class="obrero-name">${nombre}</span>
      <div class="obrero-actions">
        <button type="button" class="btn-delete" onclick="eliminarObrero('${id}')">X</button>
      </div>
      <input type="hidden" name="obreros[]" value="${id}">
    `;

    lista.appendChild(item);

    const fila = document.createElement("div");
    fila.classList.add("worker-row");
    fila.id = "horario-" + id;

    fila.innerHTML = `
      <strong>${nombre}</strong>
      <div>
        <label>Entrada</label>
        <input type="time" name="hora_entrada[${id}]" required>
      </div>
      <div>
        <label>Salida</label>
        <input type="time" name="hora_salida[${id}]" required>
      </div>
    `;

    horarios.appendChild(fila);

    selectObrero.value = "";
  });

  window.eliminarObrero = (id) => {
    obrerosSeleccionados = obrerosSeleccionados.filter(o => o !== id);
    document.getElementById("obrero-" + id)?.remove();
    document.getElementById("horario-" + id)?.remove();
  };

  // ================= MATERIALES =================
  document.getElementById("btnMaterial").addEventListener("click", () => {

    const select = document.getElementById("selectMaterial");
    const nombre = document.getElementById("nuevoMaterial").value || select.value;
    const cantidad = document.getElementById("cantidadMaterial").value;
    const costo = document.getElementById("costoMaterial").value;

    if (!nombre || !cantidad || !costo) return alert("Completa todo");

    const id = Date.now();

    const item = document.createElement("div");
    item.classList.add("obrero-item");
    item.id = "material-" + id;

    item.innerHTML = `
      <span class="obrero-name">${nombre} (${cantidad}) - $${costo}</span>
      <div class="obrero-actions">
        <button type="button" class="btn-delete" onclick="eliminarMaterial('${id}')">X</button>
      </div>
      <input type="hidden" name="material_nombre[]" value="${nombre}">
      <input type="hidden" name="material_cantidad[]" value="${cantidad}">
      <input type="hidden" name="material_costo[]" value="${costo}">
    `;

    listaMateriales.appendChild(item);

    document.getElementById("nuevoMaterial").value = "";
    document.getElementById("cantidadMaterial").value = "";
    document.getElementById("costoMaterial").value = "";
    select.value = "";
  });

  window.eliminarMaterial = id => {
    document.getElementById("material-" + id)?.remove();
  };

  // ================= HERRAMIENTAS =================
  document.getElementById("btnHerramienta").addEventListener("click", () => {

    const select = document.getElementById("selectHerramienta");
    const nombre = document.getElementById("nuevaHerramienta").value || select.value;
    const cantidad = document.getElementById("cantidadHerramienta").value;

    if (!nombre || !cantidad) return alert("Completa todo");

    const id = Date.now();

    const item = document.createElement("div");
    item.classList.add("obrero-item");
    item.id = "herramienta-" + id;

    item.innerHTML = `
      <span class="obrero-name">${nombre} (${cantidad})</span>
      <div class="obrero-actions">
        <button type="button" class="btn-delete" onclick="eliminarHerramienta('${id}')">X</button>
      </div>
      <input type="hidden" name="herramienta_nombre[]" value="${nombre}">
      <input type="hidden" name="herramienta_cantidad[]" value="${cantidad}">
    `;

    listaHerramientas.appendChild(item);

    document.getElementById("nuevaHerramienta").value = "";
    document.getElementById("cantidadHerramienta").value = "";
    select.value = "";
  });

  window.eliminarHerramienta = id => {
    document.getElementById("herramienta-" + id)?.remove();
  };

});
</script>

</body>
</html>
