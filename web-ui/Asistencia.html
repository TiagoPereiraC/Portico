<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar Asistencia</title>

<link rel="stylesheet" href="assets/css/Asistencias.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/nav-sidebar.css">
</head>

<body>

<div class="nav-dropdown">
  <button class="nav-menu-btn"><i class="fas fa-bars"></i> Menú</button>
  <ul class="nav-dropdown-menu">
    <li><a href="PanelInicio.html"><i class="fas fa-home"></i> Panel</a></li>
    <li><a href="RegistrarObra.html"><i class="fas fa-building"></i> Obras</a></li>
    <li><a href="RegistrarObrero.html"><i class="fas fa-helmet-safety"></i> Obreros</a></li>
    <li><a href="Asistencia.html" class="active"><i class="fas fa-clipboard-list"></i> Asistencia</a></li>
    <li><a href="Consultas.html"><i class="fas fa-chart-column"></i> Consultas</a></li>
    <li><a href="Login.html"><i class="fas fa-right-from-bracket"></i> Salir</a></li>
  </ul>
</div>

<nav>
  <div class="logo-wrap">
    <img src="assets/img/logo.png" alt="Pórtico Construcciones y Servicios">
  </div>
  <div class="user-pill">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
    </svg>
    Admin
  </div>
</nav>

<main>
    <div class="form">
        <h2>Registrar Asistencia</h2>

        <div class="grid">

            <div>
                <label class="label">Obrero</label>
                <select>
                    <option>Seleccionar Obrero</option>
                </select>
            </div>

            <div>
                <label class="label">Obra</label>
                <input type="text" placeholder="Nombre de la obra">
            </div>

            <div>
                <label class="label">Fecha</label>
                <input type="date">
            </div>

            <div>
                <label class="label">Estado</label>
                <select>
                    <option>Seleccionar estado</option>
                    <option>En progreso</option>
                    <option>Completa</option>
                    <option>Cancelada</option>
                </select>
            </div>

            <div class="full">
                <label class="label">Horario</label>
                <div class="row">
                    <input type="time">
                    <input type="time">
                </div>
            </div>

            <div class="full">
                <label class="label">Herramientas usadas</label>
                <textarea placeholder="Ej: pala, martillo..."></textarea>
            </div>

            <div class="full">
                <label class="label">Materiales usados</label>
                <textarea placeholder="Ej: cemento, ladrillos..."></textarea>
            </div>

        </div>

        <a href="PanelInicio.html" class="btn">Guardar</a>
        <a href="PanelInicio.html" class="btn btn-secondary">Volver</a>

    </div>
</main>

</body>
</html>
