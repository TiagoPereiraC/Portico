<main>

<form class="form" id="asistenciaForm">

<h2>Registrar Asistencia</h2>

<!-- FEEDBACK -->
<div id="feedback" class="feedback-msg hidden"></div>

<div class="grid">

<!-- OBRA -->
<div class="full">
  <label class="label">Obra</label>

  <div class="custom-select">
    <div class="custom-select-box" id="selectBoxObra">Seleccionar obra</div>
    <div class="custom-select-options" id="optionsObra"></div>
  </div>

  <input type="hidden" name="id_obra" id="inputObra">
</div>

<!-- FECHA -->
<div>
<label class="label">Fecha</label>
<input type="date" name="fecha" required>
</div>

<!-- OBREROS -->
<div class="full">
  <label class="label">Obreros</label>

  <div class="custom-select">
    <div class="custom-select-box" id="selectBoxObrero">
      Seleccionar obrero
    </div>

    <div class="custom-select-options" id="optionsObrero"></div>
  </div>
</div>

<div class="full">
  <label class="label">Obreros seleccionados</label>
<div id="listaObreros"></div>
</div>

<div class="full">
<label class="label">Horarios</label>
<div id="contenedorHorarios"></div>
</div>

<!-- FINALIZA -->
<div>
<label class="label">¿Finaliza obra?</label>
<select name="finaliza">
<option value="No">No</option>
<option value="Sí">Sí</option>
</select>
</div>

<!-- MATERIALES -->
<div class="full">
    <h3>Materiales</h3>

    <div class="smart-box">
        <div class="custom-select" id="customSelectMaterial">

            <div class="custom-select-box" id="selectBoxMaterial">
                Seleccionar material
            </div>

            <div class="custom-select-options" id="optionsMaterial">

                <div class="custom-select-search">
                    <input
                        type="text"
                        id="buscarMaterial"
                        placeholder="Buscar material..."
                        autocomplete="off"
                    >
                </div>

                <div class="custom-select-list" id="listMaterial">
                </div>

            </div>
        </div>

        <input
            type="text"
            id="nuevoMaterial"
            placeholder="Nuevo material"
        >
    </div>

    <div class="smart-box">
        <input
            type="number"
            id="cantidadMaterial"
            placeholder="Cantidad"
            min="0"
            step="0.01"
        >

        <input
            type="number"
            id="costoMaterial"
            placeholder="Costo"
            min="0"
            step="0.01"
        >
    </div>

    <button class="btn" type="button" id="btnMaterial">
        Agregar
    </button>

    <div id="listaMateriales"></div>
</div>

<!-- HERRAMIENTAS -->
<div class="full">
    <h3>Herramientas</h3>

    <div class="smart-box">
        <div class="custom-select" id="customSelectHerramienta">

            <div class="custom-select-box" id="selectBoxHerramienta">
                Seleccionar herramienta
            </div>

            <div class="custom-select-options" id="optionsHerramienta">

                <div class="custom-select-search">
                    <input
                        type="text"
                        id="searchHerramienta"
                        placeholder="Buscar herramienta..."
                        autocomplete="off"
                    >
                </div>

                <div class="custom-select-list" id="listHerramienta">
                </div>

            </div>
        </div>

        <input
            type="text"
            id="nuevaHerramienta"
            placeholder="Nueva herramienta"
        >
    </div>

    <input
        type="number"
        id="cantidadHerramienta"
        placeholder="Cantidad"
        min="0"
        step="0.01"
    >

    <button class="btn" type="button" id="btnHerramienta">
        Agregar
    </button>

    <div id="listaHerramientas"></div>
</div>

<!-- MAQUINARIA -->
<div class="full">
<h3>Maquinaria</h3>

<div class="custom-select">
  <div class="custom-select-box" id="selectBoxMaquinaria">Seleccionar maquinaria</div>
  <div class="custom-select-options" id="optionsMaquinaria"></div>
</div>

<div id="listaMaquinaria"></div>
</div>

<!-- BOTÓN -->
<div class="full">
<button class="btn" type="submit">Guardar</button>
<a href="PanelInicio.html" class="btn-back">Volver</a>

</div>
</form>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ================= ELEMENTOS =================
  const boxObra = document.getElementById("selectBoxObra");
  const optObra = document.getElementById("optionsObra");
  const inputObra = document.getElementById("inputObra");

  const boxObrero = document.getElementById("selectBoxObrero");
  const optObrero = document.getElementById("optionsObrero");

  const boxMaterial = document.getElementById("selectBoxMaterial");
  const optMaterial = document.getElementById("optionsMaterial");

  const boxHerr = document.getElementById("selectBoxHerramienta");
  const optHerr = document.getElementById("optionsHerramienta");

  const boxMaquinaria = document.getElementById("selectBoxMaquinaria");
  const optMaquinaria = document.getElementById("optionsMaquinaria");
  const listaMaquinaria = document.getElementById("listaMaquinaria");

  const lista = document.getElementById("listaObreros");
  const horarios = document.getElementById("contenedorHorarios");

  const form = document.getElementById("asistenciaForm");
  const feedback = document.getElementById("feedback");
  const btnGuardar = form.querySelector("button[type='submit']");

  let obrerosSeleccionados = [];
  let maquinariaSeleccionada = [];

  // ================= FETCH =================
  fetch("../api/datos_asistencia.php")
    .then(res => res.json())
    .then(data => {

      // ===== OBRAS =====
      data.obras.forEach(o => {
        const div = document.createElement("div");
        div.textContent = o.nombre;

        div.onclick = () => {
          boxObra.textContent = o.nombre;
          inputObra.value = o.id_obra;
          optObra.style.display = "none";
        };

        optObra.appendChild(div);
      });

      // ===== OBREROS =====
      data.obreros.forEach(o => {
        const div = document.createElement("div");
        div.textContent = o.nombre + " " + o.apellido;

        div.onclick = () => {

          const id = o.id_obrero;
          const nombre = o.nombre + " " + o.apellido;

          if (obrerosSeleccionados.includes(id)) return;

          obrerosSeleccionados.push(id);

          boxObrero.textContent = nombre;
          optObrero.style.display = "none";

          const item = document.createElement("div");
          item.classList.add("obrero-item");
          item.id = "obrero-" + id;

          item.innerHTML = `
            <span class="obrero-name">${nombre}</span>
            <div class="obrero-actions">
              <button type="button" class="btn-delete" onclick="eliminarObrero('${id}')">X</button>
            </div>
            <input type="hidden" name="obreros[]" value="${id}">
          `;

          lista.appendChild(item);

          const fila = document.createElement("div");
          fila.classList.add("worker-row");
          fila.id = "horario-" + id;

          fila.innerHTML = `
            <strong>${nombre}</strong>
            <div><label>Entrada</label><input type="time" name="hora_entrada[${id}]" required></div>
            <div><label>Salida</label><input type="time" name="hora_salida[${id}]" required></div>
          `;

          horarios.appendChild(fila);
        };

        optObrero.appendChild(div);
      });

       /* ==============================
           MATERIALES
        ============================== */

        optMaterial.innerHTML = "";

        if (Array.isArray(data.materiales)) {

            data.materiales.forEach(m => {

                if (!m.nombre) return;

                const nombre = m.nombre.trim();

                if (!nombre) return;

                const div = document.createElement("div");

                div.textContent = nombre;

                div.className = "select-option";

                div.addEventListener("click", function (e) {

                    e.stopPropagation();

                    boxMaterial.textContent = nombre;

                    optMaterial.style.display = "none";
                });

                optMaterial.appendChild(div);
            });
        }


        /* ==============================
           HERRAMIENTAS
        ============================== */

        optHerr.innerHTML = "";

        if (Array.isArray(data.herramientas)) {

            data.herramientas.forEach(h => {

                if (!h.nombre) return;

                const nombre = h.nombre.trim();

                if (!nombre) return;

                const div = document.createElement("div");

                div.textContent = nombre;

                div.className = "select-option";

                div.addEventListener("click", function (e) {

                    e.stopPropagation();

                    boxHerr.textContent = nombre;

                    optHerr.style.display = "none";
                });

                optHerr.appendChild(div);
            });
        }

    })
    .catch(error => {

        console.error(
            "Error cargando materiales/herramientas:",
            error
        );

    });

    /* =========================================
   ABRIR MATERIAL
========================================= */

boxMaterial.addEventListener("click", function (e) {

    e.stopPropagation();

    // Cerrar herramienta
    optHerr.style.display = "none";

    // Alternar material
    if (optMaterial.style.display === "block") {
        optMaterial.style.display = "none";
    } else {
        optMaterial.style.display = "block";
    }
});


/* =========================================
   ABRIR HERRAMIENTA
========================================= */

boxHerr.addEventListener("click", function (e) {

    e.stopPropagation();

    // Cerrar material
    optMaterial.style.display = "none";

    // Alternar herramienta
    if (optHerr.style.display === "block") {
        optHerr.style.display = "none";
    } else {
        optHerr.style.display = "block";
    }
});


/* =========================================
   NO CERRAR AL HACER CLICK DENTRO
========================================= */

optMaterial.addEventListener("click", function (e) {
    e.stopPropagation();
});

optHerr.addEventListener("click", function (e) {
    e.stopPropagation();
});


/* =========================================
   CERRAR AL HACER CLICK AFUERA
========================================= */

document.addEventListener("click", function () {

    optMaterial.style.display = "none";
    optHerr.style.display = "none";

});

      // ===== MAQUINARIA =====
data.maquinaria.forEach(m => {
  const div = document.createElement("div");
  div.textContent = m.nombre + (m.marca ? " (" + m.marca + ")" : "");

  div.onclick = () => {

    const id = m.id_maquinaria;

    if (maquinariaSeleccionada.includes(id)) return;

    maquinariaSeleccionada.push(id);

    boxMaquinaria.textContent = m.nombre + (m.marca ? " (" + m.marca + ")" : "");
    optMaquinaria.style.display = "none";

    const item = document.createElement("div");
    item.classList.add("item-box");
    item.id = "maquinaria-" + id;

    item.innerHTML = `
<div class="item-box">

    <span class="obrero-name">
        ${m.nombre}${m.marca ? " (" + m.marca + ")" : ""}
    </span>

    <div class="smart-box" style="margin-top:10px">

        <div>
            <label>Hora de salida</label>
            <input
                type="time"
                name="retiro_maquinaria[${id}]"
                required>
        </div>

        <div>
            <label>Hora de devolución</label>
            <input
                type="time"
                name="devolucion_maquinaria[${id}]"
                required>
        </div>

    </div>

    <!-- COMBUSTIBLE -->
    <div class="smart-box" style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
        <div>
            <label>Litros Combustible</label>
            <input
                type="number"
                step="0.01"
                name="litros[${id}]"
                placeholder="Ej: 50.5"
                min="0">
        </div>
        <div>
            <label>Tipo Combustible</label>
            <select name="nombre_combustible[${id}]">
                <option value="Diesel">Diesel</option>
                <option value="Nafta">Nafta</option>
            </select>
        </div>
        <div>
            <label>Precio Total ($)</label>
            <input
                type="number"
                step="0.01"
                name="precio_total[${id}]"
                placeholder="Ej: 2500"
                min="0">
        </div>
    </div>

    <div class="item-actions">
        <button
            type="button"
            class="btn-delete"
            onclick="eliminarMaquinaria('${id}')">
            X
        </button>
    </div>

    <input
        type="hidden"
        name="maquinaria[]"
        value="${id}">
</div>
`;

    listaMaquinaria.appendChild(item);
  };

  optMaquinaria.appendChild(div);
});

    })
    .catch(err => {
      console.error("Error al cargar datos de asistencia:", err);
      mostrarFeedback("No se pudieron cargar los datos iniciales. Revisá la conexión.", "error");
    });

  // ================= OPEN / CLOSE =================
  function toggle(box, opt) {
    box.addEventListener("click", () => {
      opt.style.display = opt.style.display === "block" ? "none" : "block";
    });
  }

  toggle(boxObra, optObra);
  toggle(boxObrero, optObrero);
  toggle(boxMaterial, optMaterial);
  toggle(boxHerr, optHerr);
  toggle(boxMaquinaria, optMaquinaria);

  // cerrar afuera
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".custom-select")) {
      document.querySelectorAll(".custom-select-options")
        .forEach(o => o.style.display = "none");
    }
  });

  // ================= ELIMINAR OBRERO =================
  window.eliminarObrero = (id) => {
    obrerosSeleccionados = obrerosSeleccionados.filter(o => o !== id);
    document.getElementById("obrero-" + id)?.remove();
    document.getElementById("horario-" + id)?.remove();
  };

  // ================= ELIMINAR MAQUINARIA =================
  window.eliminarMaquinaria = (id) => {
    maquinariaSeleccionada = maquinariaSeleccionada.filter(m => m !== Number(id));
    document.getElementById("maquinaria-" + id)?.remove();
  };

  // ================= AGREGAR MATERIAL =================
  document.getElementById("btnMaterial").addEventListener("click", () => {
    const nombreSelect = boxMaterial.textContent.trim();
    const nombreNuevo = document.getElementById("nuevoMaterial").value.trim();
    const nombre = nombreNuevo || (nombreSelect !== "Seleccionar material" ? nombreSelect : "");
    const cantidad = document.getElementById("cantidadMaterial").value;
    const costo = document.getElementById("costoMaterial").value;

    if (!nombre) { mostrarFeedback("Seleccioná o escribí un material.", "warning"); return; }
    if (!cantidad || cantidad <= 0) { mostrarFeedback("Ingresá una cantidad válida.", "warning"); return; }

    const item = document.createElement("div");
    item.classList.add("obrero-item");
    item.innerHTML = `<span class="obrero-name">${nombre} - Cant: ${cantidad} - Costo: ${costo || 0}</span><div class="obrero-actions"><button type="button" class="btn-delete">X</button></div><input type="hidden" name="material_nombre[]" value="${nombre}"><input type="hidden" name="material_cantidad[]" value="${cantidad}"><input type="hidden" name="material_costo[]" value="${costo || 0}">`;
    item.querySelector(".btn-delete").addEventListener("click", () => item.remove());
    document.getElementById("listaMateriales").appendChild(item);
    document.getElementById("nuevoMaterial").value = "";
    document.getElementById("cantidadMaterial").value = "";
    document.getElementById("costoMaterial").value = "";
    boxMaterial.textContent = "Seleccionar material";
  });

  // ================= AGREGAR HERRAMIENTA =================
  document.getElementById("btnHerramienta").addEventListener("click", () => {
    const nombreSelect = boxHerr.textContent.trim();
    const nombreNuevo = document.getElementById("nuevaHerramienta").value.trim();
    const nombre = nombreNuevo || (nombreSelect !== "Seleccionar herramienta" ? nombreSelect : "");
    const cantidad = document.getElementById("cantidadHerramienta").value;

    if (!nombre) { mostrarFeedback("Seleccioná o escribí una herramienta.", "warning"); return; }
    if (!cantidad || cantidad <= 0) { mostrarFeedback("Ingresá una cantidad válida.", "warning"); return; }

    const item = document.createElement("div");
    item.classList.add("obrero-item");
    item.innerHTML = `<span class="obrero-name">${nombre} - Cant: ${cantidad}</span><div class="obrero-actions"><button type="button" class="btn-delete">X</button></div><input type="hidden" name="herramienta_nombre[]" value="${nombre}"><input type="hidden" name="herramienta_cantidad[]" value="${cantidad}">`;
    item.querySelector(".btn-delete").addEventListener("click", () => item.remove());
    document.getElementById("listaHerramientas").appendChild(item);
    document.getElementById("nuevaHerramienta").value = "";
    document.getElementById("cantidadHerramienta").value = "";
    boxHerr.textContent = "Seleccionar herramienta";
  });

  // ================= MOSTRAR FEEDBACK =================
  function mostrarFeedback(mensaje, tipo) {
    feedback.innerHTML = `<i class="fas ${tipo === "error" ? "fa-circle-exclamation" : tipo === "success" ? "fa-circle-check" : "fa-triangle-exclamation"}"></i><span>${mensaje}</span>`;
    feedback.className = `feedback-msg ${tipo}`;
  }

  function ocultarFeedback() {
    feedback.classList.add("hidden");
  }

// ================= LIMPIAR FORMULARIO =================
  function limpiarFormulario() {

  // Limpiar campos normales
  form.reset();

  // Restablecer selects personalizados
  boxObra.textContent = "Seleccionar obra";
  inputObra.value = "";

  boxObrero.textContent = "Seleccionar obrero";
  boxMaterial.textContent = "Seleccionar material";
  boxHerr.textContent = "Seleccionar herramienta";
  boxMaquinaria.textContent = "Seleccionar maquinaria";

  // Limpiar listas generadas
  lista.innerHTML = "";
  horarios.innerHTML = "";
  document.getElementById("listaMateriales").innerHTML = "";
  document.getElementById("listaHerramientas").innerHTML = "";
  listaMaquinaria.innerHTML = "";

  // Vaciar selecciones
  obrerosSeleccionados = [];
  maquinariaSeleccionada = [];

  // Limpiar cajas auxiliares
  document.getElementById("nuevoMaterial").value = "";
  document.getElementById("cantidadMaterial").value = "";
  document.getElementById("costoMaterial").value = "";

  document.getElementById("nuevaHerramienta").value = "";
  document.getElementById("cantidadHerramienta").value = "";

  // Cerrar desplegables
  optObra.style.display = "none";
  optObrero.style.display = "none";
  optMaterial.style.display = "none";
  optHerr.style.display = "none";
  optMaquinaria.style.display = "none";
}

  // ================= SUBMIT CON FETCH =================
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    ocultarFeedback();

    const idObra = parseInt(inputObra.value, 10);
    const fecha = form.querySelector("input[name='fecha']").value.trim();
    const finaliza = form.querySelector("select[name='finaliza']").value;

    if (!idObra) {
      mostrarFeedback("Seleccioná una obra.", "error");
      return;
    }
    if (!fecha) {
      mostrarFeedback("Seleccioná una fecha.", "error");
      return;
    }
    if (!obrerosSeleccionados.length) {
      mostrarFeedback("Seleccioná al menos un obrero.", "error");
      return;
    }

    btnGuardar.disabled = true;
    btnGuardar.textContent = "Guardando...";

    try {
      const csrfResp = await fetch("../api/csrf.php", { credentials: "include" });
      const csrfData = await csrfResp.json();
      const csrfToken = csrfData.token || "";

      const formData = new FormData();
      formData.append("id_obra", String(idObra));
      formData.append("fecha", fecha);
      formData.append("finaliza", finaliza);

      obrerosSeleccionados.forEach(id => {
        formData.append("obreros[]", String(id));
        const entrada = form.querySelector(`input[name="hora_entrada[${id}]"]`);
        const salida = form.querySelector(`input[name="hora_salida[${id}]"]`);
        formData.append(`hora_entrada[${id}]`, entrada ? entrada.value : "");
        formData.append(`hora_salida[${id}]`, salida ? salida.value : "");
      });

      const listaEl = document.getElementById("listaMateriales");
      listaEl.querySelectorAll("input[name='material_nombre[]']").forEach(inp => formData.append("material_nombre[]", inp.value));
      listaEl.querySelectorAll("input[name='material_cantidad[]']").forEach(inp => formData.append("material_cantidad[]", inp.value));
      listaEl.querySelectorAll("input[name='material_costo[]']").forEach(inp => formData.append("material_costo[]", inp.value));

      const listaHerr = document.getElementById("listaHerramientas");
      listaHerr.querySelectorAll("input[name='herramienta_nombre[]']").forEach(inp => formData.append("herramienta_nombre[]", inp.value));
      listaHerr.querySelectorAll("input[name='herramienta_cantidad[]']").forEach(inp => formData.append("herramienta_cantidad[]", inp.value));

      maquinariaSeleccionada.forEach(id => {
        formData.append("maquinaria[]", String(id));
        const salida = form.querySelector(`input[name="retiro_maquinaria[${id}]"]`);
        const devolucion = form.querySelector(`input[name="devolucion_maquinaria[${id}]"]`);
        const litros = form.querySelector(`input[name="litros[${id}]"]`);
        const nombreComb = form.querySelector(`select[name="nombre_combustible[${id}]"]`);
        const precioTot = form.querySelector(`input[name="precio_total[${id}]"]`);

        formData.append(`retiro_maquinaria[${id}]`, salida ? salida.value : "");
        formData.append(`devolucion_maquinaria[${id}]`, devolucion ? devolucion.value : "");
        if (litros && parseFloat(litros.value) > 0) {
          formData.append(`litros[${id}]`, litros.value);
          formData.append(`nombre_combustible[${id}]`, nombreComb ? nombreComb.value : "Diesel");
          formData.append(`precio_total[${id}]`, precioTot ? precioTot.value : "0");
        }
      });

      const response = await fetch("../api/guardar_asistencia.php", {
        method: "POST",
        headers: { "X-CSRF-Token": csrfToken },
        credentials: "include",
        body: formData,
      });

      const text = await response.text();
      let result;
      try { result = JSON.parse(text); } catch { result = { error: text }; }

      if (!response.ok || !result.success) {
        mostrarFeedback(result.error || "Error al guardar la asistencia.", "error");
        return;
      }

      mostrarFeedback(result.message || "Asistencia guardada correctamente.", "success");

      // Resetear formulario
      limpiarFormulario();

    } catch (err) {
      console.error(err);
      mostrarFeedback(err.message || "No se pudo guardar la asistencia. Revisá los datos.", "error");
    } finally {
      btnGuardar.disabled = false;
      btnGuardar.textContent = "Guardar";
    }
  });

}

searchHerramienta.addEventListener("input", () => {

        texto,

    );
});


/* =========================================
   FILTRAR OPCIONES
========================================= */

function filtrarOpciones(lista, texto, mensaje) {

    const opciones = lista.querySelectorAll(
        ".custom-select-option"
    );

    let encontrados = 0;

    opciones.forEach(opcion => {

        const nombre = opcion.dataset.nombre.toLowerCase();

        if (nombre.includes(texto)) {

            opcion.style.display = "block";
            encontrados++;

        } else {

            opcion.style.display = "none";
        }
    });

    let vacio = lista.querySelector(".custom-select-empty");

    if (encontrados === 0) {

        if (!vacio) {

            vacio = document.createElement("div");

            vacio.className = "custom-select-empty";
            vacio.textContent = mensaje;

            lista.appendChild(vacio);
        }

        vacio.style.display = "block";

    } else if (vacio) {

        vacio.style.display = "none";
    }
}


/* =========================================
   CREAR OPCIÓN
========================================= */

function crearOpcion(nombre, tipo) {

    const div = document.createElement("div");

    div.className = "custom-select-option";

    div.dataset.nombre = nombre;

    div.textContent = nombre;

    div.addEventListener("click", (e) => {

        e.stopPropagation();

        if (tipo === "material") {

            boxMaterial.textContent = nombre;
            optionsMaterial.style.display = "none";
            searchMaterial.value = "";

        } else {

            boxHerr.textContent = nombre;
            optionsHerr.style.display = "none";
            searchHerramienta.value = "";
        }
    });

    return div;
}
