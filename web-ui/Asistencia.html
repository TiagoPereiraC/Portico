<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Asistencia</title>

<link rel="stylesheet" href="assets/css/Asistencias.css">
<link rel="stylesheet" href="assets/css/nav-sidebar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="assets/js/auth.js"></script>
</head>

<body>

<div class="nav-dropdown">
  <button class="nav-menu-btn"><i class="fas fa-bars"></i> Menú</button>
  <ul class="nav-dropdown-menu">
    <li class="nav-admin"><a href="PanelInicio.html"><i class="fas fa-home"></i> Panel</a></li>
    <li class="nav-admin"><a href="Obras.html"><i class="fas fa-building"></i> Obras</a></li>
    <li class="nav-admin"><a href="RegistrarObrero.html"><i class="fas fa-helmet-safety"></i> Obreros</a></li>
    <li><a href="Asistencia.html" class="active"><i class="fas fa-clipboard-list"></i> Asistencia</a></li>
    <li class="nav-admin"><a href="Consultas.html"><i class="fas fa-chart-column"></i> Consultas</a></li>
    <li><a href="Login.html"><i class="fas fa-right-from-bracket"></i> Salir</a></li>
  </ul>
</div>

<script>
  if (sessionStorage.getItem('rol') === 'Capataz') {
    document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'none');
  }
</script>

<nav>
  <div class="logo-wrap">
    <img src="assets/img/logo.png">
  </div>
  <div class="user-pill">Admin</div>
</nav>

<main>

<form class="form" method="POST" action="../api/guardar_asistencia.php">

<h2>Registrar Asistencia</h2>

<div class="grid">

<!-- OBRA -->
<div class="full">
  <label class="label">Obra</label>

  <div class="custom-select">
    <div class="custom-select-box" id="selectBoxObra">Seleccionar obra</div>
    <div class="custom-select-options" id="optionsObra"></div>
  </div>

  <input type="hidden" name="id_obra" id="inputObra">
</div>

<!-- FECHA -->
<div>
<label class="label">Fecha</label>
<input type="date" name="fecha" required>
</div>

<!-- OBREROS -->
<div class="full">
  <label class="label">Obreros</label>

  <div class="custom-select">
    <div class="custom-select-box" id="selectBoxObrero">
      Seleccionar obrero
    </div>

    <div class="custom-select-options" id="optionsObrero"></div>
  </div>
</div>

<div class="full">
  <label class="label">Obreros seleccionados</label>
<div id="listaObreros"></div>
</div>

<div class="full">
<label class="label">Horarios</label>
<div id="contenedorHorarios"></div>
</div>

<!-- FINALIZA -->
<div>
<label class="label">¿Finaliza obra?</label>
<select name="finaliza">
<option value="No">No</option>
<option value="Sí">Sí</option>
</select>
</div>

<!-- MATERIALES -->
<div class="full">
<h3>Materiales</h3>

<div class="smart-box">
  <div class="custom-select">
    <div class="custom-select-box" id="selectBoxMaterial">Seleccionar material</div>
    <div class="custom-select-options" id="optionsMaterial"></div>
  </div>

  <input type="text" id="nuevoMaterial" placeholder="Nuevo material">
</div>

<div class="smart-box">
<input type="number" id="cantidadMaterial" placeholder="Cantidad">
<input type="number" id="costoMaterial" placeholder="Costo">
</div>

<button class="btn" type="button" id="btnMaterial">Agregar</button>

<div id="listaMateriales"></div>
</div>

<!-- HERRAMIENTAS -->
<div class="full">
<h3>Herramientas</h3>

<div class="smart-box">
  <div class="custom-select">
    <div class="custom-select-box" id="selectBoxHerramienta">Seleccionar herramienta</div>
    <div class="custom-select-options" id="optionsHerramienta"></div>
  </div>

  <input type="text" id="nuevaHerramienta" placeholder="Nueva herramienta">
</div>

<input type="number" id="cantidadHerramienta" placeholder="Cantidad">

<button class="btn" type="button" id="btnHerramienta">Agregar</button>

<div id="listaHerramientas"></div>
</div>

<!-- BOTÓN -->
<div class="full">
<button class="btn" type="submit">Guardar</button>
<a href="PanelInicio.html" class="btn-back">Volver</a>

</div>
</form>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ================= ELEMENTOS =================
  const boxObra = document.getElementById("selectBoxObra");
  const optObra = document.getElementById("optionsObra");
  const inputObra = document.getElementById("inputObra");

  const boxObrero = document.getElementById("selectBoxObrero");
  const optObrero = document.getElementById("optionsObrero");

  const boxMaterial = document.getElementById("selectBoxMaterial");
  const optMaterial = document.getElementById("optionsMaterial");

  const boxHerr = document.getElementById("selectBoxHerramienta");
  const optHerr = document.getElementById("optionsHerramienta");

  const lista = document.getElementById("listaObreros");
  const horarios = document.getElementById("contenedorHorarios");

  let obrerosSeleccionados = [];

  // ================= FETCH =================
  fetch("../api/datos_asistencia.php")
    .then(res => res.json())
    .then(data => {

      // ===== OBRAS =====
      data.obras.forEach(o => {
        const div = document.createElement("div");
        div.textContent = o.nombre;

        div.onclick = () => {
          boxObra.textContent = o.nombre;
          inputObra.value = o.id_obra;
          optObra.style.display = "none";
        };

        optObra.appendChild(div);
      });

      // ===== OBREROS =====
      data.obreros.forEach(o => {
        const div = document.createElement("div");
        div.textContent = o.nombre + " " + o.apellido;

        div.onclick = () => {

          const id = o.id_obrero;
          const nombre = o.nombre + " " + o.apellido;

          if (obrerosSeleccionados.includes(id)) return;

          obrerosSeleccionados.push(id);

          boxObrero.textContent = nombre;
          optObrero.style.display = "none";

          const item = document.createElement("div");
          item.classList.add("obrero-item");
          item.id = "obrero-" + id;

          item.innerHTML = `
            <span class="obrero-name">${nombre}</span>
            <div class="obrero-actions">
              <button type="button" class="btn-delete" onclick="eliminarObrero('${id}')">X</button>
            </div>
            <input type="hidden" name="obreros[]" value="${id}">
          `;

          lista.appendChild(item);

          const fila = document.createElement("div");
          fila.classList.add("worker-row");
          fila.id = "horario-" + id;

          fila.innerHTML = `
            <strong>${nombre}</strong>
            <div><label>Entrada</label><input type="time" name="hora_entrada[${id}]" required></div>
            <div><label>Salida</label><input type="time" name="hora_salida[${id}]" required></div>
          `;

          horarios.appendChild(fila);
        };

        optObrero.appendChild(div);
      });

      // ===== MATERIALES =====
      data.materiales.forEach(m => {
        const div = document.createElement("div");
        div.textContent = m.nombre;

        div.onclick = () => {
          boxMaterial.textContent = m.nombre;
          optMaterial.style.display = "none";
        };

        optMaterial.appendChild(div);
      });

      // ===== HERRAMIENTAS =====
      data.herramientas.forEach(h => {
        const div = document.createElement("div");
        div.textContent = h.nombre;

        div.onclick = () => {
          boxHerr.textContent = h.nombre;
          optHerr.style.display = "none";
        };

        optHerr.appendChild(div);
      });

    });

  // ================= OPEN / CLOSE =================
  function toggle(box, opt) {
    box.addEventListener("click", () => {
      opt.style.display = opt.style.display === "block" ? "none" : "block";
    });
  }

  toggle(boxObra, optObra);
  toggle(boxObrero, optObrero);
  toggle(boxMaterial, optMaterial);
  toggle(boxHerr, optHerr);

  // cerrar afuera
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".custom-select")) {
      document.querySelectorAll(".custom-select-options")
        .forEach(o => o.style.display = "none");
    }
  });

  // ================= ELIMINAR OBRERO =================
  window.eliminarObrero = (id) => {
    obrerosSeleccionados = obrerosSeleccionados.filter(o => o !== id);
    document.getElementById("obrero-" + id)?.remove();
    document.getElementById("horario-" + id)?.remove();
  };

});
</script>

</body>
</html>
