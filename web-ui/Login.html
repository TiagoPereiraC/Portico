<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/Login-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body> 
    <div class="card">
        <img src="assets/img/logo.png" alt="Logo" class="logo">
        <h2>Iniciar Sesión</h2>
        <form id="login-form" novalidate>
            <div class="input-group">
                <i class="fas fa-user"></i> 
                <input type="text" id="usuario" name="usuario" placeholder="Usuario" autocomplete="username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <p id="error-msg" class="error-msg" aria-live="polite"></p>
            <button class="btn" type="submit" id="btn-login">Iniciar Sesión</button>
        </form>
    </div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

const errorEl = document.getElementById('error-msg');
const btnLogin = document.getElementById('btn-login');

// Recibe la respuesta de C# y actúa en consecuencia
window.chrome?.webview?.addEventListener('message', function (e) {
    const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (data.type !== 'login_response') return;

    if (data.success) {
        // La navegación a PanelInicio la hace C#, pero por si acaso:
        window.location.href = 'PanelInicio.html';
    } else {
        errorEl.textContent = data.error || 'Error desconocido';
        btnLogin.disabled   = false;
        btnLogin.textContent = 'Iniciar Sesión';
    }
});

document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.textContent  = '';
    btnLogin.disabled    = true;
    btnLogin.textContent = 'Verificando...';

    const payload = JSON.stringify({
        type:     'login',
        usuario:  document.getElementById('usuario').value.trim(),
        password: document.getElementById('password').value
    });

    // Verifica que estamos dentro de la app C# con WebView2
    if (window.chrome?.webview) {
        window.chrome.webview.postMessage(payload);
    } else {
        errorEl.textContent  = 'Esta pantalla solo funciona dentro de la aplicación.';
        btnLogin.disabled    = false;
        btnLogin.textContent = 'Iniciar Sesión';
    }
});
</script>
</script>

</body>
</html>
