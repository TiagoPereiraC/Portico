<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <link rel="stylesheet" href="assets/css/theme.css" />
        <link rel="stylesheet" href="assets/css/Login-style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
    </head>
    <body>
        <div class="card">
            <img src="assets/img/logo.png" alt="Logo" class="logo" />
            <h2>Iniciar Sesión</h2>
            <form id="login-form" novalidate>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Usuario"
                        autocomplete="username"
                        required
                    />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Contraseña"
                        required
                    />
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                    >
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p id="error-msg" class="error-msg" aria-live="polite"></p>
                <button class="btn" type="submit" id="btn-login">
                    Iniciar Sesión
                </button>
            </form>
        </div>

        <script>
            (function () {
                function redirectByRol(rol) {
                    window.location.replace(
                        rol === "Capataz" ? "Asistencia.html" : "PanelInicio.html"
                    );
                }

                // Escritorio: sessionStorage es la fuente de verdad
                if (window.chrome?.webview) {
                    var rol = sessionStorage.getItem("rol");
                    if (rol) {
                        redirectByRol(rol);
                        return;
                    }
                    return;
                }

                // Web: consultar sesión PHP antes de mostrar el login
                var isHttp = window.location.protocol.startsWith("http");
                if (!isHttp) return;

                var path = window.location.pathname;
                var idx = path.lastIndexOf("/web-ui/");
                var apiBase =
                    idx !== -1
                        ? window.location.origin + path.substring(0, idx) + "/api"
                        : window.location.origin + "/api";

                fetch(apiBase + "/session.php", { credentials: "include" })
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (data && data.autenticado) {
                            sessionStorage.setItem("user_id", String(data.user_id));
                            sessionStorage.setItem("rol", data.rol);
                            sessionStorage.setItem("nombre", data.nombre);
                            redirectByRol(data.rol);
                        }
                    })
                    .catch(function () {});
            })();

            function togglePassword(inputId, btn) {
                const input = document.getElementById(inputId);
                const icon = btn.querySelector("i");
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.replace("fa-eye", "fa-eye-slash");
                } else {
                    input.type = "password";
                    icon.classList.replace("fa-eye-slash", "fa-eye");
                }
            }

            const errorEl = document.getElementById("error-msg");
            const btnLogin = document.getElementById("btn-login");
            const isBrowserHttp = window.location.protocol.startsWith("http");

            function resolveApiBase() {
                if (!isBrowserHttp) return null;
                const path = window.location.pathname;
                const idx = path.lastIndexOf("/web-ui/");
                if (idx !== -1) {
                    return window.location.origin + path.substring(0, idx) + "/api";
                }
                return window.location.origin + "/api";
            }

            const apiBase = resolveApiBase();

            // Recibe la respuesta de C# y actúa en consecuencia
            window.chrome?.webview?.addEventListener("message", function (e) {
                const data =
                    typeof e.data === "string" ? JSON.parse(e.data) : e.data;
                if (data.type !== "login_response") return;

                if (data.success) {
                    if (data.user_id) {
                        sessionStorage.setItem("user_id", String(data.user_id));
                    }
                    sessionStorage.setItem("rol", data.rol);
                    sessionStorage.setItem("nombre", data.nombre);
                    // La navegación la hace C#; este fallback solo aplica fuera del escritorio
                    const destino =
                        data.rol === "Capataz"
                            ? "Asistencia.html"
                            : "PanelInicio.html";
                    window.location.href = destino;
                } else {
                    errorEl.textContent = data.error || "Error desconocido";
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Iniciar Sesión";
                }
            });

            document
                .getElementById("login-form")
                .addEventListener("submit", function (e) {
                    e.preventDefault();
                    iniciarSesion().catch(function (error) {
                        console.error(error);
                        errorEl.textContent =
                            error.message || "No se pudo iniciar sesión";
                        btnLogin.disabled = false;
                        btnLogin.textContent = "Iniciar Sesión";
                    });
                });

            async function iniciarSesion() {
                errorEl.textContent = "";
                btnLogin.disabled = true;
                btnLogin.textContent = "Verificando...";

                const payload = {
                    type: "login",
                    usuario: document.getElementById("usuario").value.trim(),
                    password: document.getElementById("password").value,
                };

                if (window.chrome?.webview) {
                    window.chrome.webview.postMessage(JSON.stringify(payload));
                    return;
                }

                if (!isBrowserHttp || !apiBase) {
                    throw new Error(
                        "Abrí esta pantalla desde un servidor local PHP para iniciar sesión en navegador.",
                    );
                }

                const csrfResponse = await fetch(
                    `${apiBase}/csrf.php`,
                    {
                        credentials: "include",
                    },
                );
                const csrfData = await parseJsonResponse(
                    csrfResponse,
                    "No se pudo obtener el token de seguridad.",
                );

                if (!csrfResponse.ok || !csrfData.token) {
                    throw new Error(
                        csrfData.error ||
                            "No se pudo obtener el token de seguridad.",
                    );
                }

                const response = await fetch(
                    `${apiBase}/login.php`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRF-Token": csrfData.token,
                        },
                        credentials: "include",
                        body: JSON.stringify(payload),
                    },
                );
                const data = await parseJsonResponse(
                    response,
                    "No se pudo iniciar sesión",
                );

                if (!response.ok) {
                    throw new Error(data.error || "No se pudo iniciar sesión");
                }

                sessionStorage.setItem("user_id", String(data.user_id));
                sessionStorage.setItem("rol", data.rol);
                sessionStorage.setItem("nombre", data.nombre);

                window.location.href =
                    data.rol === "Capataz"
                        ? "Asistencia.html"
                        : "PanelInicio.html";
            }

            async function parseJsonResponse(response, fallbackMessage) {
                const text = await response.text();

                if (!text) {
                    throw new Error(fallbackMessage);
                }

                try {
                    return JSON.parse(text);
                } catch {
                    throw new Error(fallbackMessage);
                }
            }
        </script>
    </body>
</html>
