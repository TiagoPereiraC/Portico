<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pórtico - Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="inicio.css">
</head>

<body>

<div class="main">

    <div class="header">
        <div class="title">
            <h1>Panel de Administración</h1>
            <p>Gestión de obras y personal</p>
        </div>

        <div><i class="fa-solid fa-user"></i> Admin</div>
    </div>

    <div class="grid">
        <a href="cliente.html" class="card">
            <div class="icon"><i class="fa-solid fa-user"></i></div>
            <h3>Clientes</h3>
            <p>Registrar y gestionar clientes</p>
        </a>

        <a href="obra.html" class="card">
            <div class="icon"><i class="fa-solid fa-building"></i></div>
            <h3>Obras</h3>
            <p>Control de construcciones</p>
        </a>

        <a href="obrero.html" class="card">
            <div class="icon"><i class="fa-solid fa-helmet-safety"></i></div>
            <h3>Obreros</h3>
            <p>Gestión del personal</p>
        </a>

        <a href="asistencia.html" class="card">
            <div class="icon"><i class="fa-solid fa-clipboard-list"></i></div>
            <h3>Asistencia</h3>
            <p>Registro diario</p>
        </a>

        <a href="consultas.html" class="card">
            <div class="icon"><i class="fa-solid fa-chart-column"></i></div>
            <h3>Consultas</h3>
            <p>Informes y datos</p>
        </a>

        <a href="login.html" class="card">
            <div class="icon"><i class="fa-solid fa-right-from-bracket"></i></div>
            <h3>Salir</h3>
            <p>Cerrar sesión</p>
        </a>
    </div>

</div>

</body>
</html>
