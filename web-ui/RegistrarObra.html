<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pórtico - Registrar Obra</title>
  <link rel="stylesheet" href="assets/css/regObras.css"/>
</head>
<body>

  <nav>
    <div class="logo-wrap">
      <img src="assets/img/logo.png" alt="Pórtico Construcciones y Servicios" />
    </div>

    <div class="user-pill">
      <!-- Person icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4
                 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6
                 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      Admin
    </div>
  </nav>

  <main>
    <div class="card">
      <h1>Registrar Obra</h1>

      <div class="field">
        <input type="text" placeholder="Numero de contrata" />
      </div>

      <div class="field">
        <input type="text" placeholder="Descripción" />
      </div>

      <div class="date-row">
        <div class="date-group">
          <label>Fecha inicio</label>
          <input type="date" value="2026-05-20" />
        </div>
        <div class="date-group">
          <label>Fecha fin</label>
          <input type="date" value="2026-06-20" />
        </div>
      </div>

      <div class="file-field">
        <input type="file" />
      </div>

      <button class="btn-save">Guardar</button>
    </div>
  </main>

</body>
</html>
