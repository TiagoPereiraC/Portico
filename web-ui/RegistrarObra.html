<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pórtico - Registrar Obra</title>
  <link rel="stylesheet" href="assets/css/regObras.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/nav-sidebar.css">
</head>
<body>

<div class="nav-dropdown">
  <button class="nav-menu-btn"><i class="fas fa-bars"></i> Menú</button>
  <ul class="nav-dropdown-menu">
    <li><a href="PanelInicio.html"><i class="fas fa-home"></i> Panel</a></li>
    <li><a href="RegistrarObra.html" class="active"><i class="fas fa-building"></i> Obras</a></li>
    <li><a href="RegistrarObrero.html"><i class="fas fa-helmet-safety"></i> Obreros</a></li>
    <li><a href="Asistencia.html"><i class="fas fa-clipboard-list"></i> Asistencia</a></li>
    <li><a href="Consultas.html"><i class="fas fa-chart-column"></i> Consultas</a></li>
    <li><a href="Login.html"><i class="fas fa-right-from-bracket"></i> Salir</a></li>
  </ul>
</div>

<nav>
  <div class="logo-wrap">
    <img src="assets/img/logo.png" alt="Pórtico Construcciones y Servicios">
  </div>
  <div class="user-pill">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
    </svg>
    Admin
  </div>
</nav>

  <main>
    <div class="card">
      <h1>Registrar Obra</h1>

      <div class="field">
        <input type="text" id="numero_contrata" name="numero_contrata" placeholder="Número de contrata" />
      </div>

      <div class="field">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre de la obra" />
      </div>

      <div class="field">
        <input type="text" id="descripcion" name="descripcion" placeholder="Descripción" />
      </div>

      <div class="field">
        <input type="text" id="nombre_cliente" name="nombre_cliente" placeholder="Nombre del cliente" />
      </div>

      <div class="field">
        <input type="text" id="telefono_cliente" name="telefono_cliente" placeholder="Teléfono del cliente" />
      </div>

      <div class="date-row">
        <div class="date-group">
          <label>Fecha inicio</label>
          <input type="date" value="2026-05-20" />
        </div>
        <div class="date-group">
          <label>Fecha fin</label>
          <input type="date" value="2026-06-20" />
        </div>
      </div>

      <div class="file-field">
        <input type="file" />
      </div>

      <button class="btn-save">Guardar</button>
      <a href="PanelInicio.html" class="btn-back">Volver</a>
    </div>
  </main>

</body>
</html>
