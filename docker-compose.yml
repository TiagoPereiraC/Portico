version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: portico-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Portico2026!
      MYSQL_DATABASE: portico
      MYSQL_USER: portico
      MYSQL_PASSWORD: portico2026
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: portico-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: portico
      DB_USER: portico
      DB_PASSWORD: portico2026
      TZ: America/Montevideo
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
